version: 2

multi-ecosystem-groups:
  backend:
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"

updates:

  # Backend dependencies (Gradle + the container images in the dev stack) grouped into one PR
  - package-ecosystem: "gradle"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "backend"
    # Konsist 0.17.3 cannot parse sources under Kotlin 2.4.20 (KoInternalException)
    ignore:
      - dependency-name: "org.jetbrains.kotlin:*"
        versions: [">=2.4.20"]
      - dependency-name: "org.jetbrains.kotlin.*"
        versions: [">=2.4.20"]

  - package-ecosystem: "docker-compose"
    directory: "/stack"
    patterns:
      - "*"
    multi-ecosystem-group: "backend"

  # Dev tooling (bpmnlint)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      tooling-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
      tooling-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
