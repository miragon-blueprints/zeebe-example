name: Pre-Merge Checks

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build + contract drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Lint BPMN (bpmnlint)
        run: |
          npm ci
          npm run lint:bpmn

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # The process tests run their own Camunda 8 runtime via Testcontainers, so the
      # ubuntu runner's Docker daemon is all that is needed — no external stack.
      - name: Maven build (arch + unit + process + model validation + spec export)
        run: ./mvnw -B verify

      # bpmn-to-code's generate-bpmn-api goal runs in the generate-sources phase of `./mvnw verify` and
      # writes the typed process API (one `*ProcessApi.java` per model plus the shared ServiceTasks/
      # Messages/ProcessVariables/Errors/Escalations files) into the committed source tree; fail if the
      # .bpmn models and the checked-in generated code drift, including a newly generated file that was
      # never committed.
      - name: Verify the generated BPMN process API is in sync
        run: |
          git add --intent-to-add -- service/app/src/main/java/io/miragon/blueprint/adapter/process
          git diff --exit-code -- service/app/src/main/java/io/miragon/blueprint/adapter/process

      # The OpenAPI spec is generated by a test and committed; fail if the code and the checked-in
      # contract have drifted. See the OpenAPI-contract ADR.
      - name: Verify the committed OpenAPI contract is in sync
        run: git diff --exit-code -- openapi/openapi.json

  mutation:
    name: Mutation testing (PIT, gate 80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compute changed backend classes
        id: scope
        run: |
          CLASSES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- service/app/src/main/java \
            | grep '\.java$' \
            | sed -E 's#^service/app/src/main/java/##; s#\.java$##; s#/#.#g; s#$#*#' \
            | paste -sd, -)
          echo "classes=$CLASSES" >> "$GITHUB_OUTPUT"
          echo "Scoped mutation classes: ${CLASSES:-<none — pitest skipped>}"

      - name: Run PIT mutation testing (diff-scoped)
        if: steps.scope.outputs.classes != ''
        run: ./mvnw -B -pl service/app -am test-compile pitest:mutationCoverage -DtargetClasses="${{ steps.scope.outputs.classes }}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitest-report
          path: service/app/target/pit-reports
          if-no-files-found: warn

  bruno:
    name: Bruno end-to-end scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Camunda 8 self-managed stack (Zeebe + Operate/Tasklist, Elasticsearch) and Postgres.
      - name: Start the Camunda 8 stack
        run: docker compose -f stack/docker-compose.yml up -d

      - name: Wait for Zeebe to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9600/actuator/health > /dev/null; then
              echo "Zeebe is up"; exit 0
            fi
            sleep 5
          done
          echo "Zeebe did not start in time"; docker compose -f stack/docker-compose.yml logs --tail 200; exit 1

      - name: Start the application
        run: ./mvnw -B -pl service/app -am spring-boot:run > app.log 2>&1 &

      - name: Wait for the application to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health/readiness > /dev/null; then
              echo "Application is up"; exit 0
            fi
            sleep 3
          done
          echo "Application did not start in time"; tail -n 200 app.log; exit 1

      - name: Run Bruno scenarios
        working-directory: bruno
        # Pin the CLI: sandbox capabilities (available globals, require whitelist)
        # can change between majors, so an unpinned "latest" is a correctness risk,
        # not just a supply-chain one. The polling helpers rely on require('axios').
        run: npx --yes @usebruno/cli@4.0.0 run . --env local -r

      - name: Dump application log on failure
        if: failure()
        run: tail -n 300 app.log

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f stack/docker-compose.yml logs --tail 300
